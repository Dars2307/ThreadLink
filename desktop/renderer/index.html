<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <title>ThreadLink</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="shell" class="shell">
      <aside id="rail" class="rail">
        <div class="brand"><span class="mark" aria-hidden="true">⇄</span> ThreadLink</div>
        <nav id="nav" class="nav" aria-label="Sections"></nav>
        <div class="rail-foot">
          <span id="rail-dot" class="dot"></span>
          <span id="rail-status" class="rail-status">Starting…</span>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="titles">
            <h1 id="page-title">Home</h1>
            <p id="page-sub" class="sub"></p>
          </div>
          <div class="status-pill">
            <span id="status-dot" class="dot"></span><span id="status-title">Starting…</span>
          </div>
        </header>

        <main id="view" class="view"></main>

        <footer class="footer">
          <button id="open-dashboard" class="ghost" type="button">Open dashboard</button>
          <span id="footer-detail" class="muted small"></span>
        </footer>
      </div>
    </div>

    <template id="tpl-signin">
      <section class="hero">
        <div class="card stack">
          <h2>Welcome to ThreadLink</h2>
          <p class="muted">
            Connect this computer once. Then, from ChatGPT, just say “send this to Claude”.
          </p>
          <label class="field">
            <span>ThreadLink address</span>
            <input id="base-url" type="url" spellcheck="false" />
          </label>
          <button id="signin" class="primary" type="button">Sign in with your browser</button>
          <p class="muted small">
            Your browser opens for sign-in and approval. Nothing to copy, no tokens, no terminal.
          </p>
        </div>
      </section>
    </template>

    <template id="tpl-reconnect">
      <section class="hero">
        <div class="card stack">
          <h2>Reconnect ThreadLink</h2>
          <p id="reconnect-why" class="muted"></p>
          <label class="field">
            <span>ThreadLink address</span>
            <input id="reconnect-url" type="url" spellcheck="false" />
          </label>
          <button id="reconnect" class="primary" type="button">Sign in with your browser</button>
          <p class="muted small">
            Your project folders and chosen conversations are kept. Only this computer's sign-in is
            renewed.
          </p>
        </div>
      </section>
    </template>

    <template id="tpl-waiting">
      <section class="hero">
        <div class="card stack center">
          <h2>Approve this computer</h2>
          <p class="muted">Your browser should be open. Check that it shows this code:</p>
          <p id="user-code" class="code big"></p>
          <a id="approve-link" class="link" href="#">Open the approval page again</a>
          <button id="cancel-signin" class="ghost" type="button">Cancel</button>
        </div>
      </section>
    </template>

    <template id="tpl-home">
      <section class="stack">
        <div id="home-summary" class="tiles" aria-label="Summary"></div>
        <div id="links" class="stack"></div>
        <div class="card stack">
          <h2>Agents on this computer</h2>
          <div id="home-health" class="health-list"></div>
        </div>
        <div class="card stack">
          <div class="card-head">
            <h2>Linked conversations</h2>
            <button id="home-manage" class="ghost small-btn" type="button">Manage</button>
          </div>
          <div id="home-conversations" class="list"></div>
        </div>
        <div class="card stack">
          <div class="card-head">
            <h2>Recent activity</h2>
            <button id="home-activity-dashboard" class="ghost small-btn" type="button">
              Open dashboard
            </button>
          </div>
          <div id="home-activity" class="activity"></div>
        </div>
        <div class="card stack">
          <h2>Connect ChatGPT</h2>
          <p class="muted small">
            Add ThreadLink as a connector in ChatGPT (Settings → Apps &amp; Connectors), then say
            “Link this chat to Claude Code”. Approve the request here.
          </p>
          <div class="row">
            <code id="mcp-url" class="grow"></code>
            <button id="copy-mcp" class="ghost small-btn" type="button">Copy</button>
          </div>
        </div>
      </section>
    </template>

    <template id="tpl-agents">
      <section class="stack">
        <div class="card stack">
          <h2>Providers on this computer</h2>
          <p class="muted small">
            ThreadLink checks each provider with a real signed-in call, not just its status.
          </p>
          <div id="agents-health" class="health-list"></div>
        </div>
        <div class="card stack">
          <div class="card-head">
            <h2>Attached conversations</h2>
            <button id="add-more" class="ghost small-btn" type="button">Attach another…</button>
          </div>
          <div id="attached" class="list"></div>
        </div>
      </section>
    </template>

    <template id="tpl-chats">
      <section class="stack">
        <div id="chat-groups" class="stack"></div>
      </section>
    </template>

    <template id="tpl-attach">
      <section class="stack">
        <div class="card stack">
          <h2>Claude Code</h2>
          <p id="claude-detect" class="muted small"></p>
        </div>
        <div class="card stack">
          <h2>Choose a project folder</h2>
          <div id="workspace-list" class="list"></div>
          <button id="add-workspace" class="ghost small-btn" type="button">
            Choose another folder…
          </button>
        </div>
        <div class="card stack" id="conversation-card" hidden>
          <h2>Run tasks using</h2>
          <div id="attach-mode"></div>
          <p class="muted small">
            ThreadLink never opens a Claude Code window. Requests run out of sight, and what
            happened shows up in your chat and in this app.
          </p>
        </div>
        <div class="card stack" id="conversation-pick" hidden>
          <h2>Choose a Claude conversation</h2>
          <div id="conversation-list" class="list"></div>
          <button id="attach-fresh" class="ghost small-btn" type="button">
            Use a new headless session for each request instead
          </button>
          <p id="attach-fresh-why" class="muted small"></p>
          <p id="attach-problem" class="small danger-text" hidden></p>
        </div>
        <div class="row">
          <button id="attach-back" class="ghost" type="button">Back</button>
        </div>
      </section>
    </template>

    <template id="tpl-runtime">
      <section class="stack">
        <div class="card stack">
          <h2>This computer</h2>
          <div id="runtime-kv" class="kv"></div>
          <div class="row">
            <button id="pause" class="ghost" type="button">Pause</button>
            <button id="restart" class="ghost" type="button">Restart</button>
          </div>
        </div>
        <div class="card stack">
          <h2>Project folders</h2>
          <div id="workspaces" class="list"></div>
        </div>
        <details class="card advanced">
          <summary>Advanced</summary>
          <div id="runtime-advanced"></div>
        </details>
      </section>
    </template>

    <template id="tpl-notifications">
      <section class="stack">
        <div class="card stack">
          <h2>Desktop notifications</h2>
          <label class="toggle">
            <input id="set-notifications" type="checkbox" />
            <span>Tell me when a request finishes or needs me</span>
          </label>
          <p class="muted small">
            You are told when a request finishes, when one fails, and when a chat asks to be linked.
            Progress and routine checks never interrupt you. Notifications show the request name and
            where it ran — never the request, the result or anything secret.
          </p>
        </div>
      </section>
    </template>

    <template id="tpl-settings">
      <section class="stack">
        <div class="card stack">
          <h2>General</h2>
          <label class="toggle">
            <input id="set-autostart" type="checkbox" />
            <span>Start ThreadLink when I log in</span>
          </label>
        </div>
        <div class="card stack">
          <h2>Providers &amp; plans</h2>
          <p class="muted small">
            Your plan is the one you chose in ThreadLink; it decides which models ThreadLink may
            use. What each app reports about itself is shown beside it.
          </p>
          <div id="providers" class="list"></div>
          <div id="providers-check"></div>
          <div class="card-head">
            <p class="muted small">The ThreadLink plan you pay for is set in the web dashboard.</p>
            <button id="plan-dashboard" class="ghost small-btn" type="button">
              Open dashboard
            </button>
          </div>
        </div>
        <details class="card advanced">
          <summary>Advanced</summary>
          <div id="settings-advanced"></div>
        </details>
        <div class="card stack">
          <h2>Sign out</h2>
          <p class="muted small">
            Disconnects this computer from ThreadLink. Your project folders and chosen conversations
            stay on this machine.
          </p>
          <div class="row">
            <button id="signout" class="ghost danger" type="button">Sign out</button>
          </div>
        </div>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
